name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run pytest

      # dogfood: the nanny must block a leaky diff
      - name: self-check
        run: |
          mkdir /tmp/selfcheck && cd /tmp/selfcheck
          git init -q
          echo 'AWS_KEY = "AKIAIOSFODNN7EXAMPLE"' > app.py
          git add app.py
          set +e
          "$GITHUB_WORKSPACE/.venv/bin/gitnanny" check --target staged --no-llm
          code=$?
          set -e
          test "$code" -eq 1
